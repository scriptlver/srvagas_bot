name: Sr. Vagas 🕵️‍♀️

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 08:00 no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write    

concurrency:
  group: bot-vagas         
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar o bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/index.js

      - name: Salvar histórico de vagas enviadas
        if: always()
        run: |
          if [ -f enviadas.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add enviadas.json
            git diff --cached --quiet || (git commit -m "chore: atualiza histórico de vagas enviadas" && git push)
          fi